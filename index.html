                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                </svg>
                <span className="text-[10px] font-semibold">Location</span>

              <a
                href="https://wa.me/917845798944?text=Hi%20NUFA%20Gaming%20Turf,%20I%20would%20like%20to%20book%20a%20slot"
                target="_blank"
                className="flex flex-col items-center gap-1 py-1 px-3 text-[#47e246]"
              >
                <WhatsAppIcon className="w-5 h-5 text-[#47e246]" />
                <span className="text-[10px] font-semibold">Book Now</span>
              </a>
            </div>
          </nav>

          {/* VIRTUAL TOUR MODAL */}
          {virtualTourOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="relative w-full max-w-4xl bg-[#09120c] border border-emerald-800 rounded-2xl overflow-hidden shadow-2xl">
                <button
                  onClick={() => setVirtualTourOpen(false)}
                  className="absolute top-4 right-4 z-10 p-2 rounded-full bg-black/70 text-white hover:text-[#47e246]"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
                <div className="relative aspect-video w-full bg-black">
                  <iframe
                    className="w-full h-full"
                    src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1"
                    title="NUFA Gaming Turf Tour"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowFullScreen
                  />
                </div>
                <div className="p-5 flex flex-col sm:flex-row items-center justify-between gap-4 bg-[#070e0a]">
                  <div>
                    <h3 className="text-lg font-bold text-white font-heading">
                      NUFA Gaming Turf - 360° Virtual Experience
                    </h3>
                    <p className="text-xs text-gray-400">
                      Siruseri, Chennai • Night floodlights & international grade synthetic turf
                    </p>
                  </div>
                  <a
                    href="https://wa.me/917845798944?text=Hi%20NUFA%20Gaming%20Turf,%20I%20watched%20the%20tour%20and%20want%20to%20book%20a%20slot"
                    target="_blank"
                    className="bg-[#47e246] text-black font-bold px-5 py-2 rounded-full text-xs flex items-center gap-2"
                  >
                    <WhatsAppIcon className="w-4 h-4 text-black" />
                    <span>Book Slot</span>
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* LIGHTBOX MODAL */}
          {selectedImage && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md"
              onClick={() => setSelectedImage(null)}
            >
              <div className="relative max-w-4xl w-full flex flex-col items-center" onClick={(e) => e.stopPropagation()}>
                <button
                  onClick={() => setSelectedImage(null)}
                  className="absolute -top-10 right-0 text-white hover:text-[#47e246]"
                >
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
                <img
                  src={selectedImage.url}

                  className="w-full max-h-[75vh] object-contain rounded-xl border border-emerald-950"
                />
                <p className="mt-3 text-sm font-semibold text-white">{selectedImage.title}</p>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
